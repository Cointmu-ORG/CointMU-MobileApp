name: Release

# A version tag (pushed by scripts/bump-version.js) builds the signed release
# APK and attaches it to a draft GitHub Release for review. A manual run builds
# the same APK as a workflow artifact only, for test builds. Never runs on
# pull_request.
on:
  push:
    branches: [ci/android-release-apk]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IS_TAG_BUILD: ${{ github.event_name == 'push' }}
      # Read by scripts/generate-build-info.js, both in the "Build info" step
      # and when Metro bundles inside Gradle (D-75).
      BUILD_CHANNEL: ${{ github.event_name == 'push' && 'release' || 'preview' }}
      # Public values (they ship inside the app), so repository variables.
      EXPO_PUBLIC_RPC_URLS: ${{ vars.EXPO_PUBLIC_RPC_URLS }}
      EXPO_PUBLIC_CHAIN_ID: ${{ vars.EXPO_PUBLIC_CHAIN_ID }}
      # Optional: empty disables error reporting, the build still succeeds.
      EXPO_PUBLIC_GLITCHTIP_DSN: ${{ secrets.EXPO_PUBLIC_GLITCHTIP_DSN }}
      # Optional public certificate of a GlitchTip server with a self-signed
      # certificate; trusted for the DSN host only (D-87).
      GLITCHTIP_CERT_PEM: ${{ vars.GLITCHTIP_CERT_PEM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Its npm caching runs `npm config get cache` with Node's bundled
          # npm before the pinned npm is installed.
          package-manager-cache: false

      # A tag that disagrees with package.json would publish an APK whose
      # version is not the release's.
      - name: Check tag against package.json
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)."
            exit 1
          fi

      - name: Check build configuration
        run: |
          missing=""
          [ -n "$EXPO_PUBLIC_RPC_URLS" ] || missing="$missing EXPO_PUBLIC_RPC_URLS"
          [ -n "$EXPO_PUBLIC_CHAIN_ID" ] || missing="$missing EXPO_PUBLIC_CHAIN_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variable(s):$missing. Set them under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_GLITCHTIP_DSN" ]; then
            echo "::notice::EXPO_PUBLIC_GLITCHTIP_DSN is not set: this build has error reporting disabled."
          fi

      # Same npm as Dependabot and local: package.json "packageManager".
      # Must run before any other npm command in the repo, so setup-node's
      # `cache: npm` (it calls `npm config get cache` first) is replaced by
      # actions/cache.
      - name: Use pinned npm
        id: npm
        run: |
          version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          [ "$(npm -v)" = "$version" ] || npm install -g "npm@$version"
          echo "cache=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm.outputs.cache }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      # Caches the Gradle distribution, dependencies and build cache.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - run: npm ci --ignore-scripts

      # The keystore is decoded into the runner's temp dir, never the
      # checkout, and deleted in the last step. Values are only ever passed
      # through the environment; nothing here prints one.
      - name: Prepare signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            if [ "$IS_TAG_BUILD" = "true" ]; then
              echo "::error::Missing signing secret(s):$missing. A release must be signed with the release key."
              exit 1
            fi
            echo "::warning::Missing signing secret(s):$missing. Building an unsigned preview (debug key); it cannot update an installed release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # Fails here, with keytool's reason, on a wrong password or alias.
          keytool -list -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Source maps go to GlitchTip only when a token exists (D-82). The
      # server is LAN-only today, so a failed upload must not fail the build.
      - name: Configure source map upload
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_ALLOW_FAILURE=true" >> "$GITHUB_ENV"
          else
            echo "SENTRY_DISABLE_AUTO_UPLOAD=true" >> "$GITHUB_ENV"
          fi

      # --ignore-scripts skips the `prepare` hook that writes build-info.json
      # (D-72), which the app imports.
      - name: Build info
        run: npm run build-info

      # Generates android/ from app.json and the config plugins in plugins/:
      # versionCode, release signing and the network security config.
      - name: Prebuild
        # Prebuild rewrites the android/ios npm scripts; restoring the file
        # keeps the tree clean, so build info does not report "modified".
        run: |
          npx --no expo prebuild --platform android --clean --no-install
          git checkout -- package.json
        # Signing values are passed only when all four exist, so an unsigned
        # preview never trips the plugin's "incomplete config" check.
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ steps.signing.outputs.signed == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}

      # A universal APK (all ABIs) with Hermes, the template's defaults.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ steps.signing.outputs.signed == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Package
        id: package
        env:
          IS_SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          version=$(node -p "require('./package.json').version")
          codename=$(node -p "require('./package.json').codename")
          version_code=$(node -p "require('./plugins/android-version').toVersionCode(require('./package.json').version)")
          suffix=""
          [ "$IS_TAG_BUILD" = "true" ] || suffix="-preview"
          [ "$IS_SIGNED" = "true" ] || suffix="-unsigned-preview"
          apk="Muvo-$version-$codename$suffix.apk"

          mkdir out
          mv android/app/build/outputs/apk/release/app-release.apk "out/$apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "out/$apk"
          (cd out && sha256sum "$apk" > "$apk.sha256")
          sha256=$(cut -d ' ' -f 1 "out/$apk.sha256")
          size=$(du -h "out/$apk" | cut -f 1)

          {
            echo ""
            echo "## Build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$apk\` ($size) |"
            echo "| Version | $version-$codename |"
            echo "| versionCode | $version_code |"
            echo "| Commit | $GITHUB_SHA |"
            echo "| Built | $(node -p "require('./build-info.json').builtAt") |"
            echo "| SHA-256 | \`$sha256\` |"
            echo ""
            echo "Check the download with \`sha256sum -c $apk.sha256\`."
          } > build-notes.md
          cat build-notes.md >> "$GITHUB_STEP_SUMMARY"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.apk }}
          path: |
            out/
            build-notes.md
          if-no-files-found: error

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  # Only this job can write to the repository, and only for a tag.
  release:
    name: Draft release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      # Categories come from .github/release.yml, as on desktop.
      - name: Release notes
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > release-notes.md
          cat build-notes.md >> release-notes.md

      # The release stays a draft: the owner reviews and publishes it.
      # Idempotent: a re-run replaces the assets and notes of the draft. The
      # list endpoint, unlike /releases/tags, includes drafts.
      - name: Create draft release
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")][0]")
          if [ -z "$release" ] || [ "$release" = "null" ]; then
            prerelease=""
            case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft $prerelease \
              --title "${GITHUB_REF_NAME#v}" --notes-file release-notes.md out/*
            exit 0
          fi
          if [ "$(jq -r .draft <<<"$release")" != "true" ]; then
            echo "::error::Release $GITHUB_REF_NAME is already published; not replacing its files."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber out/*
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
