version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    # Versions pinned by the Expo SDK move together via `npx expo install --fix`
    # on an SDK upgrade (AGENTS.md); single bumps would break the SDK pins.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "jest-expo"
      - dependency-name: "@types/react"
      - dependency-name: "typescript"
      # NativeWind v4 (react-native-css-interop) needs Tailwind v3 (D-30).
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # eslint-config-expo's plugins (react, import) do not load on a newer
      # ESLint major; it moves with the Expo SDK's eslint-config-expo.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR for all actions: codeql-action's init and analyze steps must be
    # on the same version, and separate PRs fail CodeQL on each one.
    groups:
      actions:
        patterns: ["*"]
